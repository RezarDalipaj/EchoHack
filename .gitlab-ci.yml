# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml


stages:          # List of stages for jobs, and their order of execution
  - build
  - docker
  - deploy

variables:
  APP_NAME: ecohack
  NAMESPACE: geek-squad # Environment variable equal to your kubernetes Namespace

frontend-code-quality:
  stage: .pre # Hidden Built-in stage for Gitlab CI. No need to declare in the stages snippet.
  image: sonarsource/sonar-scanner-cli:latest
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey="${NAMESPACE}-${APP_NAME}-frontend" -Dsonar.projectName="${NAMESPACE} Template Frontend"

build-backend-app:
  stage: build # This job runs in the build stage.
  image: maven:3.9.1-eclipse-temurin-17-alpine
  variables:
    MAVEN_OPTS: >-
        -Dhttps.protocols=TLSv1.2
        -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
        -Dorg.slf4j.simpleLogger.showDateTime=true
  script:
    - ls -lah .
    - cd ecohack-api
    - mvn clean verify sonar:sonar -Dsonar.login=$SONAR_TOKEN -Dsonar.host.url=https://sonarqube.lhindtia-devenv.com -Dsonar.projectName="${NAMESPACE} Template Backend" -Dsonar.projectKey=${NAMESPACE}-${APP_NAME}-backend
    - mvn clean package $MAVEN_OPTS --batch-mode
  artifacts:
    paths:
      - "ecohack-api/target"
    when: on_success

build-frontend-app:
  stage: build
  image: node:18.16.0-alpine
  script:
    - ls -lah .
    - cd ecohack-ui
    - npm install -dd
    - CI=false npm run build
  artifacts:
    paths:
      - "ecohack-ui/build"
    when: on_success
  needs:
    - frontend-code-quality

docker image:
  image: docker:20.10.16
  services:
  - name: docker:20.10.16-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  stage: docker
  needs:
    - job: "build-backend-app"
    - job: "build-frontend-app"
  before_script:
    - until docker info; do sleep 1; done
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker build . -t $CI_REGISTRY_IMAGE:backend -f DockerfileBackend
    - docker build ecohack-ui/ -t $CI_REGISTRY_IMAGE:frontend -f ecohack-ui/DockerfileFrontend
    - docker images
    - docker push --all-tags $CI_REGISTRY_IMAGE

deploy-job:      # This job runs in the deploy stage.
  stage: deploy
  image: alpine/helm
  environment:
    name: production
    url: https://frontend-${NAMESPACE}.lhindtia-devenv.com
  script:
    - echo "Deploying application..."
    - helm dep update ./helm/ecohack
    - helm upgrade ${APP_NAME} ./helm/ecohack --install --values=./helm/ecohack/values.yaml --namespace ${NAMESPACE}
    - echo "Application successfully deployed."
